[project]
name = "custom-ocr-workers"
version = "0.1.0"
description = "Local rendering and MLX inference workers for the custom-ocr pi extension"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pillow>=10.4",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
private = [
    "mlx-vlm>=0.1.21; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
